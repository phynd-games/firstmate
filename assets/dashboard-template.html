<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firstmate - control plane</title>
<style>
/* ============================================================
   Firstmate control plane - Firstmate Design System, inlined.
   Tokens match .agents/skills/bearings/assets/board-template.html so the two
   local surfaces read as one product. No webfont is imported and no asset is
   fetched: the page must render identically with no network at all, so every
   family is a system stack.
   ============================================================ */
:root {
  --rust-700: #8f2f17; --rust-600: #a93a1f; --rust-500: #c0452a;
  --rust-400: #d35f3f; --rust-300: #e08365; --rust-100: #f4d8c9; --rust-050: #fbece3;
  --navy-700: #1a2238; --navy-600: #222c49; --navy-500: #2a3656;
  --navy-300: #6c7796; --navy-100: #d9deea;
  --gold-600: #b5791c; --gold-500: #e0a52e; --gold-300: #f0d38c; --gold-100: #f8ecc9;
  --ocean-600: #2f6688; --ocean-500: #3c7ea6; --ocean-200: #b6d4e2; --ocean-050: #e8f1f5;
  --sea-700: #234e3a; --sea-500: #2f6b4f; --sea-200: #b9d4c5; --sea-050: #e9f2ec;
  --paper-000: #fbf4e2; --paper-100: #f6ecd3; --paper-200: #f0e3c4; --paper-300: #e7d6ae;
  --cream-line: #ddc89c;
  --ink-900: #241c14; --ink-700: #3f3224; --ink-500: #6f5e46; --ink-300: #9c8a6c;
  --white: #fffdf7;
  --bg-page: var(--paper-100);
  --surface-card: var(--white);
  --surface-card-warm: var(--paper-000);
  --text-strong: var(--ink-900); --text-body: var(--ink-700);
  --text-muted: var(--ink-500); --text-faint: var(--ink-300);
  --border-default: var(--cream-line); --border-soft: var(--paper-300);
  --status-online: var(--sea-500); --status-online-soft: var(--sea-050);
  --status-warn: var(--gold-600); --status-warn-soft: var(--gold-100);
  --status-danger: var(--rust-600); --status-danger-soft: var(--rust-050);
  --status-info: var(--ocean-500); --status-info-soft: var(--ocean-050);
  --font-display: "Cooper Black", Rockwell, Georgia, serif;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --fs-h3: 1.4rem; --fs-h4: 1.15rem; --fs-base: 1rem; --fs-sm: 0.9375rem;
  --fs-xs: 0.8125rem; --fs-2xs: 0.6875rem;
  --ls-caps: 0.16em;
  --radius-xs: 6px; --radius-sm: 9px; --radius-md: 12px;
  --radius-lg: 18px; --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(36, 28, 20, 0.06), 0 4px 10px rgba(36, 28, 20, 0.06);
  --shadow-hard: 4px 4px 0 var(--ink-900);
  --shadow-hard-sm: 3px 3px 0 var(--ink-900);
  --focus-ring: 0 0 0 3px var(--gold-300);
  --container-app: 1240px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--text-body);
  background: var(--bg-page);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ---- shared Firstmate primitives ---- */
.fm-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-2xs); font-weight: 800; line-height: 1;
  padding: 5px 9px 4px; text-transform: uppercase; letter-spacing: 0.07em;
  border-radius: var(--radius-xs); border: 1.5px solid var(--ink-900);
  box-shadow: 2px 2px 0 var(--ink-900); white-space: nowrap;
}
.fm-badge--online  { background: var(--sea-500);  color: var(--paper-000); }
.fm-badge--warn    { background: var(--gold-500); color: var(--navy-700); }
.fm-badge--danger  { background: var(--rust-600); color: var(--paper-000); }
.fm-badge--info    { background: var(--ocean-500); color: var(--paper-000); }
.fm-badge--neutral { background: var(--paper-000); color: var(--ink-900); }

.fm-btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font-family: var(--font-sans); font-size: var(--fs-sm); font-weight: 700;
  padding: 9px 18px; border-radius: var(--radius-sm);
  border: 2px solid var(--ink-900); background: var(--paper-000);
  color: var(--ink-900); line-height: 1;
}
.fm-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.fm-btn:active { transform: translateY(1px); }
.fm-btn--sm { font-size: var(--fs-xs); padding: 7px 13px; }
.fm-btn--primary { background: var(--rust-500); color: var(--white); box-shadow: var(--shadow-hard-sm); }
.fm-btn--primary:hover { background: var(--rust-600); }
.fm-btn--ghost { background: transparent; border-color: var(--border-default); color: var(--text-muted); }
.fm-btn--ghost:hover { border-color: var(--ink-500); color: var(--text-strong); }

.fm-card {
  background: var(--surface-card); border: 1.5px solid var(--border-default);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm); min-width: 0;
}
.fm-card--poster { border: 2px solid var(--ink-900); box-shadow: var(--shadow-hard); }
.fm-card--warm { background: var(--surface-card-warm); }

.fm-sign {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700;
  text-transform: uppercase; letter-spacing: var(--ls-caps); color: var(--text-muted);
}
.fm-sign--eyebrow { color: var(--rust-500); }
.fm-ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.18em; }

/* ---- page chrome ---- */
.cp-nav {
  position: sticky; top: 0; z-index: 40;
  background: var(--paper-000); border-bottom: 2px solid var(--ink-900);
}
.cp-nav__inner {
  max-width: var(--container-app); margin: 0 auto; padding: 12px 22px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.cp-brand { display: inline-flex; align-items: center; gap: 11px; flex: none; }
.cp-brand__disc {
  width: 34px; height: 34px; border-radius: var(--radius-pill);
  background: var(--rust-500); color: var(--paper-000);
  display: grid; place-items: center; border: 2px solid var(--ink-900);
}
.cp-brand__disc svg { width: 60%; height: 60%; }
.cp-brand__wm { font-family: var(--font-display); font-size: 21px; color: var(--text-strong); line-height: 1; }
.cp-brand__sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint);
  text-transform: uppercase; letter-spacing: var(--ls-caps); display: block; margin-top: 2px; }
.cp-nav__spacer { flex: 1 1 auto; }
.cp-nav__meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.cp-mono { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

.cp-tabs {
  max-width: var(--container-app); margin: 0 auto; padding: 0 22px;
  display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto;
}
.cp-tab {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted);
  padding: 9px 11px; border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer;
}
.cp-tab:hover { color: var(--text-strong); }
.cp-tab.is-active { color: var(--rust-600); border-bottom-color: var(--rust-500); }
.cp-tab__n { color: var(--text-faint); font-weight: 600; }

.cp-main {
  max-width: var(--container-app); margin: 0 auto;
  padding: 22px 22px 64px; display: flex; flex-direction: column; gap: 26px;
}

/* ---- stat strip ---- */
.cp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.cp-stat {
  background: var(--surface-card); border: 1.5px solid var(--border-default);
  border-radius: var(--radius-sm); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.cp-stat--alert { background: var(--rust-050); border: 2px solid var(--rust-500); }
.cp-stat__num { font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: 600;
  line-height: 1; color: var(--text-strong); }
.cp-stat--alert .cp-stat__num { color: var(--rust-600); }
.cp-stat__label { font-family: var(--font-mono); font-size: var(--fs-2xs);
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }

/* ---- notices ---- */
.cp-notices { display: flex; flex-direction: column; gap: 10px; }
.cp-notice {
  display: flex; gap: 11px; align-items: flex-start; padding: 12px 15px;
  border-radius: var(--radius-sm); border-left: 5px solid var(--status-warn);
  background: var(--status-warn-soft); font-size: var(--fs-sm); color: var(--text-body);
}
.cp-notice--danger { border-left-color: var(--status-danger); background: var(--status-danger-soft); }
.cp-notice--info { border-left-color: var(--status-info); background: var(--status-info-soft); }
.cp-notice__body { min-width: 0; }
.cp-notice__title { font-weight: 800; color: var(--text-strong); }
.cp-notice__detail { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 2px; word-break: break-word; }

/* ---- sections ---- */
.cp-section { display: flex; flex-direction: column; gap: 13px; min-width: 0; scroll-margin-top: 152px; }
.cp-section[hidden] { display: none; }
.cp-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cp-section__note { font-size: var(--fs-xs); color: var(--text-muted); }
.cp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 16px; }
.cp-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }

/* ---- worker cards ---- */
.cp-worker { display: flex; flex-direction: column; min-width: 0; }
.cp-worker__pad { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cp-worker__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.cp-worker__id { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 700;
  color: var(--text-strong); word-break: break-all; }
.cp-worker__repo { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 1px; }
.cp-worker__badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: none; }
.cp-state {
  border: 1.5px solid var(--border-default); border-radius: var(--radius-sm);
  background: var(--paper-000); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px;
}
.cp-state__k { font-family: var(--font-mono); font-size: var(--fs-2xs);
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
.cp-state__v { font-size: var(--fs-sm); color: var(--text-strong); font-weight: 700; }
.cp-state__d { font-size: var(--fs-xs); color: var(--text-muted); }

.cp-kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; align-items: baseline; }
.cp-kv__k { font-family: var(--font-mono); font-size: var(--fs-2xs);
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
.cp-kv__v { font-size: var(--fs-xs); color: var(--text-body); min-width: 0; word-break: break-word; }
.cp-kv__v--mono { font-family: var(--font-mono); }

.cp-link { color: var(--ocean-600); font-weight: 600; word-break: break-all; }
.cp-link:hover { text-decoration: underline; }
.cp-actionlink { cursor: pointer; color: var(--ocean-600); font-weight: 600; }
.cp-actionlink:hover { text-decoration: underline; }

details.cp-fold { border-top: 1px dashed var(--border-default); padding-top: 9px; }
details.cp-fold > summary {
  cursor: pointer; list-style: none; font-family: var(--font-mono);
  font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--rust-500); font-weight: 700; padding: 2px 0;
}
details.cp-fold > summary::-webkit-details-marker { display: none; }
details.cp-fold > summary::before { content: "\25B8 "; }
details.cp-fold[open] > summary::before { content: "\25BE "; }
details.cp-fold > summary:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---- event log ---- */
.cp-events { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
.cp-event { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: baseline; }
.cp-event__note { font-size: var(--fs-xs); color: var(--text-body); word-break: break-word; }
.cp-event__note--empty { color: var(--text-faint); font-style: italic; }

/* ---- compact rows ---- */
.cp-rows { display: flex; flex-direction: column; }
.cp-row {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 15px; border-top: 1px solid var(--border-default); min-width: 0;
}
.cp-row:first-child { border-top: none; }
.cp-row__main { min-width: 0; flex: 1 1 auto; }
.cp-row__title { font-size: var(--fs-sm); font-weight: 700; color: var(--text-strong);
  line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
.cp-row__sub { font-size: var(--fs-xs); color: var(--text-muted); line-height: 1.35;
  margin-top: 1px; word-break: break-word; }
.cp-row__side { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  justify-content: flex-end; max-width: 46%; }
.cp-empty { padding: 17px; font-size: var(--fs-sm); color: var(--text-muted); }

/* ---- tables ---- */
.cp-tablewrap { overflow-x: auto; }
.cp-table { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
.cp-table th, .cp-table td { padding: 9px 13px; text-align: left; border-top: 1px solid var(--border-default);
  vertical-align: top; }
.cp-table th { font-family: var(--font-mono); font-size: var(--fs-2xs); text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-faint); font-weight: 700; border-top: none; white-space: nowrap; }
.cp-table td.cp-num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.cp-table td.cp-mono-cell { font-family: var(--font-mono); word-break: break-all; }

/* ---- filter ---- */
.cp-filter {
  font-family: var(--font-sans); font-size: var(--fs-sm); color: var(--text-strong);
  padding: 8px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-default);
  background: var(--white); min-width: 220px;
}
.cp-filter:focus { outline: none; border-color: var(--rust-400); box-shadow: var(--focus-ring); }

/* ---- report drawer ---- */
.cp-drawer {
  position: fixed; inset: 0; z-index: 60; display: none;
  background: rgba(36, 28, 20, 0.45); padding: 26px;
}
.cp-drawer.is-open { display: grid; place-items: center; }
.cp-drawer__panel {
  background: var(--white); border: 2px solid var(--ink-900); border-radius: var(--radius-md);
  box-shadow: var(--shadow-hard); width: min(960px, 100%); max-height: 100%;
  display: flex; flex-direction: column; min-width: 0;
}
.cp-drawer__head {
  padding: 15px 18px; border-bottom: 1.5px solid var(--border-default);
  display: flex; align-items: flex-start; gap: 12px; background: var(--paper-000);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.cp-drawer__title { font-size: var(--fs-h4); font-weight: 800; color: var(--text-strong);
  word-break: break-word; min-width: 0; flex: 1 1 auto; }
.cp-drawer__body { padding: 20px 24px 28px; overflow: auto; min-width: 0; }

/* ---- rendered markdown (built as DOM nodes, never as HTML text) ---- */
.cp-md { font-size: var(--fs-sm); color: var(--text-body); }
.cp-md h1, .cp-md h2, .cp-md h3, .cp-md h4 { color: var(--text-strong); line-height: 1.25; margin: 1.4em 0 0.5em; }
.cp-md h1 { font-size: 1.5rem; } .cp-md h2 { font-size: 1.25rem; }
.cp-md h3 { font-size: 1.06rem; } .cp-md h4 { font-size: 0.97rem; }
.cp-md > :first-child { margin-top: 0; }
.cp-md p { margin: 0 0 0.85em; }
.cp-md ul, .cp-md ol { margin: 0 0 0.85em; padding-left: 1.5em; }
.cp-md li { margin-bottom: 0.25em; }
.cp-md blockquote { margin: 0 0 0.85em; padding: 2px 0 2px 14px;
  border-left: 3px solid var(--border-default); color: var(--text-muted); }
.cp-md hr { border: none; border-top: 1px solid var(--border-default); margin: 1.4em 0; }
.cp-md code { font-family: var(--font-mono); font-size: 0.88em; background: var(--paper-100);
  border: 1px solid var(--border-soft); border-radius: var(--radius-xs); padding: 1px 4px; }
.cp-md pre { background: var(--navy-700); color: var(--paper-000); border-radius: var(--radius-sm);
  padding: 13px 15px; overflow-x: auto; margin: 0 0 0.9em; }
.cp-md pre code { background: none; border: none; padding: 0; color: inherit; font-size: 0.82rem; }
.cp-md table { border-collapse: collapse; width: 100%; font-size: var(--fs-xs); margin: 0 0 0.9em; }
.cp-md th, .cp-md td { border: 1px solid var(--border-default); padding: 7px 10px; text-align: left; }
.cp-md th { background: var(--paper-100); font-family: var(--font-mono); font-size: var(--fs-2xs);
  text-transform: uppercase; letter-spacing: 0.04em; }
.cp-md a { color: var(--ocean-600); font-weight: 600; text-decoration: underline; word-break: break-all; }
.cp-mdwrap { overflow-x: auto; }

/* ---- provenance ---- */
.cp-foot { border-top: 1px solid var(--border-default); padding-top: 16px;
  font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-faint); }

.cp-copy { display: block; width: 100%; font-family: var(--font-mono); font-size: var(--fs-xs);
  color: var(--text-body); background: var(--paper-100); border: 1px solid var(--border-soft);
  border-radius: var(--radius-xs); padding: 7px 9px; margin-top: 6px; word-break: break-all; }

.cp-visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 900px) {
  .cp-cols { grid-template-columns: 1fr; }
  .cp-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="cp-nav">
  <div class="cp-nav__inner">
    <span class="cp-brand">
      <span class="cp-brand__disc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
        </svg>
      </span>
      <span>
        <span class="cp-brand__wm">control plane</span>
        <span class="cp-brand__sub">read-only view</span>
      </span>
    </span>
    <span class="cp-nav__spacer"></span>
    <span class="cp-nav__meta" id="cp-nav-meta"></span>
  </div>
  <nav class="cp-tabs" id="cp-tabs" aria-label="Sections"></nav>
</header>

<main class="cp-main" id="cp-main">
  <div class="cp-stats" id="cp-stats"></div>
  <div class="cp-notices" id="cp-notices"></div>
  <div id="cp-sections"></div>
  <footer class="cp-foot" id="cp-provenance"></footer>
</main>

<div class="cp-drawer" id="cp-drawer" role="dialog" aria-modal="true" aria-labelledby="cp-drawer-title">
  <div class="cp-drawer__panel">
    <div class="cp-drawer__head">
      <div style="min-width:0;flex:1 1 auto;">
        <div class="cp-drawer__title" id="cp-drawer-title">-</div>
        <div class="cp-mono" id="cp-drawer-path" style="max-width:100%;"></div>
      </div>
      <button type="button" class="fm-btn fm-btn--sm fm-btn--ghost" id="cp-drawer-close">Close</button>
    </div>
    <div class="cp-drawer__body" id="cp-drawer-body"></div>
  </div>
</div>

<!-- ONE SLOT. bin/fm-dashboard.sh build injects the fresh fm-dashboard.v1
     payload in place of the placeholder below; everything above and below is
     the shipped template and is never regenerated per run. -->
<script id="fm-dashboard-data" type="application/json">
__FM_DASHBOARD_DATA__
</script>

<script>
(function () {
  "use strict";

  var SCHEMA = "fm-dashboard.v1";

  /* ---------------------------------------------------------------
     DOM helpers. Every value that came out of the payload reaches the
     page as a text node or an attribute set through the DOM API, never
     as markup: this page never assigns innerHTML, so a report, a status
     line, or a backlog note cannot become executable HTML.
     --------------------------------------------------------------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function add(parent, node) { parent.appendChild(node); return node; }
  function txt(parent, tag, cls, text) { return add(parent, el(tag, cls, text)); }
  function dash(v) { return (v === null || v === undefined || v === "") ? "-" : String(v); }
  function num(v) { return (typeof v === "number" && isFinite(v)) ? v : 0; }
  function arr(v) { return Array.isArray(v) ? v : []; }

  function badge(parent, text, tone) {
    return add(parent, el("span", "fm-badge fm-badge--" + (tone || "neutral"), text));
  }
  function kvRow(parent, key, value, mono) {
    txt(parent, "span", "cp-kv__k", key);
    txt(parent, "span", "cp-kv__v" + (mono ? " cp-kv__v--mono" : ""), dash(value));

    var top = add(pad, el("div", "cp-worker__top"));
    var idBox = add(top, el("div"));
    txt(idBox, "div", "cp-worker__id", dash(t.id));
    var bl = backlogById[t.id];
    txt(idBox, "div", "cp-worker__repo",
      [(bl && bl.title) || t.project, bl && bl.repo].filter(Boolean).join(" - ") || "-");
    var badges = add(top, el("div", "cp-worker__badges"));
    badge(badges, dash(t.kind), t.kind === "secondmate" ? "info" : "neutral");
    var cs = t.current_state || {};
    badge(badges, dash(cs.state), stateTone(cs.state));

    var state = add(pad, el("div", "cp-state"));
    txt(state, "div", "cp-state__k", "current state - reconciled");
    txt(state, "div", "cp-state__v", dash(cs.state) + " - via " + dash(cs.source));
    txt(state, "div", "cp-state__d", dash(cs.detail));
    txt(state, "div", "cp-state__d",
      "observed " + dash(cs.observed_at) + " (" + dash(cs.freshness) + ")");

    var kv = add(pad, el("div", "cp-kv"));
    kvRow(kv, "runtime", dash(t.harness) + " / " + dash(t.model) + " / " + dash(t.effort), true);
    kvRow(kv, "delivery", dash(t.mode) + " - merge by captain: " + (t.yolo === "on" ? "no" : "yes"));
    var ep = t.endpoint || {};
    var epText = (ep.exists === true ? "present" : ep.exists === false ? "absent" : "unknown")
      + " - " + dash(ep.target) + " (" + dash(t.backend) + ")";
    if (t.kind === "secondmate") epText += " - agent " + dash(ep.agent_alive);
    kvRow(kv, "endpoint", epText, true);
    if (t.remote) kvRow(kv, "remote", dash(t.remote.host) + ":" + dash(t.remote.root), true);
    var paths = t.paths || {};
    var loc = (paths.home && paths.home.path) || (paths.worktree && paths.worktree.path) || null;
    kvRow(kv, "local copy", loc, true);
    txt(kv, "span", "cp-kv__k", "pr");
    var prCell = add(kv, el("span", "cp-kv__v cp-kv__v--mono"));
    if (t.pr && t.pr.url) {
      externalLink(prCell, t.pr.url, t.pr.url);
      txt(prCell, "span", "cp-state__d", " recorded from " + dash(t.pr.source) + "; not a live check");
    } else {
      prCell.textContent = "none recorded";
    }

    var decisions = arr(t.hints && t.hints.open_decisions);
    if (decisions.length) {
      var dfold = add(pad, el("details", "cp-fold"));
      dfold.setAttribute("open", "open");
      txt(dfold, "summary", "", "Open captain's calls (" + decisions.length + ")");
      var dlist = add(dfold, el("div", "cp-events"));
      decisions.forEach(function (d) {
        var row = add(dlist, el("div", "cp-event"));
        badge(row, dash(d.verb || d.state || "open"), "warn");
        txt(row, "span", "cp-event__note", dash(d.summary || d.note || d.raw || d.key));
      });
    }

    var ev = eventsById[t.id];
    var evFold = add(pad, el("details", "cp-fold"));
    var evCount = ev && ev.readable ? num(ev.shown) : 0;
    txt(evFold, "summary", "", "Event history (" + evCount + " of " + (ev ? num(ev.total) : 0) + ")");
    var evBody = add(evFold, el("div", "cp-events"));
    if (!ev || !ev.readable) {
      txt(evBody, "div", "cp-event__note cp-event__note--empty",
        ev ? "No event history: " + dash(ev.reason) : "No event history recorded.");
    } else if (!arr(ev.lines).length) {
      txt(evBody, "div", "cp-event__note cp-event__note--empty", "No events recorded yet.");
    } else {
      arr(ev.lines).slice().reverse().forEach(function (line) {
        var row = add(evBody, el("div", "cp-event"));
        badge(row, dash(line.verb), verbTone(line.verb));
        var noteCell = add(row, el("span", "cp-event__note"));
        noteCell.textContent = line.note ? String(line.note) : String(line.raw || "");
      });
      if (num(ev.truncated) > 0) {
        txt(evBody, "div", "cp-event__note cp-event__note--empty",
          num(ev.truncated) + " older events not shown; the full log is at " + dash(ev.path));
      }
      txt(evBody, "div", "cp-event__note cp-event__note--empty", "source: " + dash(ev.path));
    }

    var rp = reportsById[t.id] || ((paths.report && paths.report.present) ? { id: t.id } : null);
    if (rp && reportsById[t.id]) {
      var artFold = add(pad, el("details", "cp-fold"));
      txt(artFold, "summary", "", "Report");
      var artBody = add(artFold, el("div", "cp-events"));
      addReportOpener(artBody, reportsById[t.id]);
    }

    var actions = t.actions || {};
    if (actions.watch) {
      var cmdFold = add(pad, el("details", "cp-fold"));
      txt(cmdFold, "summary", "", "Inspect from your own terminal");
      txt(cmdFold, "div", "cp-copy", String(actions.watch));
      txt(cmdFold, "div", "cp-event__note cp-event__note--empty",
        "Read-only. This page never runs anything; firstmate stays the only way to steer a worker.");
    }
  }

  /* --- captain's calls -------------------------------------------- */
  tab("calls", "Captain's calls", calls.length + openDecisions.length);
  var secCalls = section("calls", "Captain's calls and holds",
    "Work waiting on a decision from you, plus every hold recorded against a task.");
  var callsCard = add(secCalls, el("div", "fm-card fm-card--warm"));
  var callsRows = add(callsCard, el("div", "cp-rows"));
  if (!calls.length && !openDecisions.length && !holds.length) {
    emptyRow(callsRows, "Nothing is waiting on you.");
  }
  openDecisions.forEach(function (o) {
    var row = add(callsRows, el("div", "cp-row"));
    var main = add(row, el("div", "cp-row__main"));
    txt(main, "div", "cp-row__title",
      dash(o.decision.summary || o.decision.note || o.decision.raw || o.decision.key));
    txt(main, "div", "cp-row__sub", "raised by " + dash(o.task_id) + " - key " + dash(o.decision.key));
    var side = add(row, el("div", "cp-row__side"));
    badge(side, dash(o.decision.verb || "open"), "danger");
  });
  calls.concat(holds.filter(function (h) { return calls.indexOf(h) === -1; })).forEach(function (r) {
    var row = add(callsRows, el("div", "cp-row"));
    var main = add(row, el("div", "cp-row__main"));
    txt(main, "div", "cp-row__title", dash(r.title || r.raw));
    var sub = dash(r.repo) + " - " + dash(r.hold_reason || r.blocked_reason || "held");
    if (r.hold_until) sub += " - deferred to " + r.hold_until;
    if (arr(r.unresolved_blocker_ids).length) {
      sub += " - waiting on " + arr(r.unresolved_blocker_ids).join(", ");
    }
    txt(main, "div", "cp-row__sub", sub);
    var side = add(row, el("div", "cp-row__side"));
    badge(side, r.captain_actionable ? "your call now" : "deferred",
      r.captain_actionable ? "danger" : "warn");
    if (r.hold_kind) badge(side, dash(r.hold_kind), "neutral");
  });

  /* --- backlog ------------------------------------------------------ */
  tab("backlog", "Backlog", backlog.length);
  var secBacklog = section("backlog", "Backlog",
    "Exactly as recorded in " + dash(snapshot.backlog && snapshot.backlog.path) + ".");
  var backlogCols = add(secBacklog, el("div", "cp-cols"));
  [["in_flight", "In flight"], ["queued", "Queued"], ["done", "Done"]].forEach(function (group) {
    var col = add(backlogCols, el("div", "cp-section"));
    var rows_ = backlog.filter(function (r) { return r.state === group[0]; });
    txt(col, "span", "fm-sign", group[1] + " (" + rows_.length + ")");
    var card = add(col, el("div", "fm-card"));
    var rowsRoot = add(card, el("div", "cp-rows"));
    if (!rows_.length) { emptyRow(rowsRoot, "Nothing here."); return; }
    rows_.forEach(function (r) {
      var row = add(rowsRoot, el("div", "cp-row"));
      var main = add(row, el("div", "cp-row__main"));
      txt(main, "div", "cp-row__title", dash(r.title || r.raw));
      var bits = [r.repo, r.kind];
      if (r.since) bits.push("since " + r.since);
      if (r.completion && r.completion.verb) {
        bits.push(r.completion.verb + " " + dash(r.completion.date));
      }
      txt(main, "div", "cp-row__sub", bits.filter(Boolean).join(" - ") || "-");
      if (r.body_excerpt) {
        txt(main, "div", "cp-row__sub",
          "note: " + r.body_excerpt + " (source: " + dash(snapshot.backlog.path) + ")");
      }
      var side = add(row, el("div", "cp-row__side"));
      if (!r.structured) badge(side, "free-form", "warn");
      if (r.pr_url) externalLink(side, r.pr_url, "PR");
      if (r.report_path && reportsById[r.id]) addReportOpener(side, reportsById[r.id], "report");
    });
  });

  /* --- delivery ----------------------------------------------------- */
  var deliveryRows = [];
  tasks.forEach(function (t) {
    if (t.pr && t.pr.url) {
      deliveryRows.push({
        id: t.id, url: t.pr.url, source: t.pr.source,
        mode: t.mode, yolo: t.yolo, merged: (backlogById[t.id] || {}).merged || null
      });
    }
  });
  backlog.forEach(function (r) {
    if (r.pr_url && !deliveryRows.some(function (d) { return d.url === r.pr_url; })) {
      deliveryRows.push({ id: dash(r.id), url: r.pr_url, source: "backlog", mode: null, yolo: null, merged: r.merged });
    }
  });
  tab("delivery", "Delivery", deliveryRows.length);
  var secDelivery = section("delivery", "Delivery evidence",
    "Recorded locally. This page makes no network call, so no live check state is claimed.");
  var deliveryCard = add(secDelivery, el("div", "fm-card"));
  if (!deliveryRows.length) {
    emptyRow(deliveryCard, "No pull request is recorded in this home.");
  } else {
    var dw = add(deliveryCard, el("div", "cp-tablewrap"));
    var dt = add(dw, el("table", "cp-table"));
    var dh = add(add(dt, el("thead")), el("tr"));
    ["task", "pull request", "recorded from", "delivery mode", "merge recorded"].forEach(function (h) {
      txt(dh, "th", "", h);
    });
    var db = add(dt, el("tbody"));
    deliveryRows.forEach(function (d) {
      var tr = add(db, el("tr"));
      txt(tr, "td", "cp-mono-cell", dash(d.id));
      externalLink(add(tr, el("td", "cp-mono-cell")), d.url, d.url);
      txt(tr, "td", "", dash(d.source));
      txt(tr, "td", "", d.mode ? dash(d.mode) + (d.yolo === "on" ? " - auto merge" : " - captain merges") : "-");
      txt(tr, "td", "", dash(d.merged));
    });
  }

  /* --- reports ------------------------------------------------------ */
  tab("reports", "Reports", num(reports.total));
  var secReports = section("reports", "Reports and findings",
    "Durable deliverables written by workers. Rendered as text, never as live HTML.");
  var repHead = secReports.children[0];
  var filter = el("input", "cp-filter");
  filter.setAttribute("type", "search");
  filter.setAttribute("id", "cp-report-filter");
  filter.setAttribute("placeholder", "Filter reports");
  filter.setAttribute("aria-label", "Filter reports");
  add(repHead, filter);
  var reportsCard = add(secReports, el("div", "fm-card"));
  var reportRows = add(reportsCard, el("div", "cp-rows"));
  var reportRowNodes = [];
  if (!arr(reports.records).length) emptyRow(reportRows, "No report has been written in this home.");
  arr(reports.records).forEach(function (r) {
    var row = add(reportRows, el("div", "cp-row"));
    row.setAttribute("data-report", String(r.id));
    reportRowNodes.push({ node: row, hay: (String(r.id) + " " + String(r.path || "")).toLowerCase() });
    var main = add(row, el("div", "cp-row__main"));
    txt(main, "div", "cp-row__title", dash(r.id));
    var sub = dash(r.path);
    if (r.readable) {
      sub += " - " + num(r.bytes) + " bytes";
      if (r.modified) sub += " - modified " + r.modified;
      if (r.truncated) sub += " - shown truncated";
    } else {
      sub += " - " + dash(r.reason);
    }
    txt(main, "div", "cp-row__sub", sub);
    var side = add(row, el("div", "cp-row__side"));
    if (r.truncated) badge(side, "truncated", "warn");
    if (!r.readable) badge(side, "unavailable", "danger");
    else addReportOpener(side, r, "Open");
  });
  if (num(reports.truncated) > 0) {
    txt(reportsCard, "div", "cp-empty",
      num(reports.truncated) + " further reports were not read because of this page's report limit.");
  }
  filter.addEventListener("input", function () {
    var q = String(filter.value || "").toLowerCase().trim();
    reportRowNodes.forEach(function (r) { r.node.hidden = q !== "" && r.hay.indexOf(q) === -1; });
  });

  /* --- notifications ------------------------------------------------ */
  tab("wakes", "Notifications", num(wakes.total));
  var secWakes = section("wakes", "Queued notifications",
    "Durable records firstmate has not yet handled and acknowledged.");
  var wakeCard = add(secWakes, el("div", "fm-card"));
  if (!arr(wakes.records).length) {
    emptyRow(wakeCard, dash(wakes.reason || "No queued notification."));
  } else {
    var ww = add(wakeCard, el("div", "cp-tablewrap"));
    var wt = add(ww, el("table", "cp-table"));
    var wh = add(add(wt, el("thead")), el("tr"));
    ["queued at", "no.", "kind", "about", "detail"].forEach(function (h) { txt(wh, "th", "", h); });
    var wb = add(wt, el("tbody"));
    arr(wakes.records).forEach(function (w) {
      var tr = add(wb, el("tr"));
      if (w.malformed) {
        txt(tr, "td", "cp-mono-cell", "-");
        txt(tr, "td", "cp-num", "-");
        var mc = add(tr, el("td"));
        badge(mc, "unreadable", "danger");
        txt(tr, "td", "", "-");
        txt(tr, "td", "cp-mono-cell", dash(w.payload));
        return;
      }
      txt(tr, "td", "cp-mono-cell", stampIso(w.epoch) + " (" + agoSeconds(Math.round((NOW - w.epoch * 1000) / 1000)) + ")");
      txt(tr, "td", "cp-num", dash(w.seq));
      var kc = add(tr, el("td"));
      badge(kc, dash(w.kind), w.kind === "stale" ? "danger" : w.kind === "heartbeat" ? "neutral" : "info");
      txt(tr, "td", "cp-mono-cell", dash(w.key));
      txt(tr, "td", "", dash(w.payload));
    });
  }
  if (num(wakes.truncated) > 0) {
    txt(wakeCard, "div", "cp-empty",
      num(wakes.truncated) + " older queued notifications are not shown.");
  }

  /* --- usage --------------------------------------------------------- */
  var budget = usage.budget || {};
  tab("usage", "Usage", arr(usage.agents).length);
  var secUsage = section("usage", "Model and token records",
    "Every token and model fact this home records locally. No vendor account is queried.");
  var usageCols = add(secUsage, el("div", "cp-cols"));

  var agentsCol = add(usageCols, el("div", "cp-section"));
  txt(agentsCol, "span", "fm-sign", "Dispatched runtimes");
  var agentsCard = add(agentsCol, el("div", "fm-card"));
  if (!arr(usage.agents).length) {
    emptyRow(agentsCard, "No worker is running in this home.");
  } else {
    var aw = add(agentsCard, el("div", "cp-tablewrap"));
    var at = add(aw, el("table", "cp-table"));
    var ah = add(add(at, el("thead")), el("tr"));
    ["task", "runtime", "model", "effort"].forEach(function (h) { txt(ah, "th", "", h); });
    var ab = add(at, el("tbody"));
    arr(usage.agents).forEach(function (a) {
      var tr = add(ab, el("tr"));
      txt(tr, "td", "cp-mono-cell", dash(a.task_id));
      txt(tr, "td", "", dash(a.harness));
      txt(tr, "td", "cp-mono-cell", dash(a.model));
      txt(tr, "td", "", dash(a.effort));
    });
  }

  var budgetCol = add(usageCols, el("div", "cp-section"));
  txt(budgetCol, "span", "fm-sign", "Startup memory budget");
  var budgetCard = add(budgetCol, el("div", "fm-card"));
  if (!budget.available) {
    emptyRow(budgetCard, dash(budget.reason || "The local token budget could not be read."));
  } else {
    var bw = add(budgetCard, el("div", "cp-tablewrap"));
    var bt = add(bw, el("table", "cp-table"));
    var bh = add(add(bt, el("thead")), el("tr"));
    ["file", "bytes", "est. tokens", "state"].forEach(function (h) { txt(bh, "th", "", h); });
    var bb = add(bt, el("tbody"));
    arr(budget.files).forEach(function (f) {
      var tr = add(bb, el("tr"));
      txt(tr, "td", "cp-mono-cell", dash(f.file));
      txt(tr, "td", "cp-num", dash(f.bytes));
      txt(tr, "td", "cp-num", dash(f.estimated_tokens));
      txt(tr, "td", "", dash(f.status));
    });
    var totalRow = add(budgetCard, el("div", "cp-row"));
    var totalMain = add(totalRow, el("div", "cp-row__main"));
    txt(totalMain, "div", "cp-row__title",
      num(budget.total_estimated_tokens) + " of " + num(budget.effective_budget_tokens) + " estimated tokens");
    txt(totalMain, "div", "cp-row__sub", "conservative local estimate, not a vendor meter");
    badge(add(totalRow, el("div", "cp-row__side")), dash(budget.status),
      budget.status === "within-budget" ? "online" : "warn");
  }

  /* --- sources -------------------------------------------------------- */
  var sources = [
    ["home", data.fm_home],
    ["state", snapshot.roots && snapshot.roots.state],
    ["data", snapshot.roots && snapshot.roots.data],
    ["projects", snapshot.roots && snapshot.roots.projects],
    ["backlog", snapshot.backlog && snapshot.backlog.path],
    ["wake queue", (snapshot.roots && snapshot.roots.state) + "/.wake-queue"],
    ["watch lock", (snapshot.roots && snapshot.roots.state) + "/.watch.lock"],
    ["watcher heartbeat", (snapshot.roots && snapshot.roots.state) + "/.last-watcher-beat"],
    ["away marker", (snapshot.roots && snapshot.roots.state) + "/.afk"],
    ["recovery marker", (snapshot.roots && snapshot.roots.state) + "/.watcher-down"],
    ["startup memory budget", (snapshot.roots && snapshot.roots.config) + "/startup-memory-budget"],
    ["startup memory captain.md", (snapshot.roots && snapshot.roots.data) + "/captain.md"],
    ["startup memory captain-shared.md", (snapshot.roots && snapshot.roots.data) + "/captain-shared.md"],
    ["startup memory learnings.md", (snapshot.roots && snapshot.roots.data) + "/learnings.md"]
  ];
  events.forEach(function (e) { sources.push(["events " + e.task_id, e.path]); });
  arr(reports.records).forEach(function (r) { sources.push(["report " + r.id, r.path]); });
  tab("sources", "Sources", sources.length);
  var secSources = section("sources", "Exact sources",
    "Every path this page read, unaltered, so any claim here can be checked at its source.");
  var sourcesCard = add(secSources, el("div", "fm-card"));
  var sw = add(sourcesCard, el("div", "cp-tablewrap"));
  var st = add(sw, el("table", "cp-table"));
  var sh = add(add(st, el("thead")), el("tr"));
  ["surface", "path"].forEach(function (h) { txt(sh, "th", "", h); });
  var sb = add(st, el("tbody"));
  sources.forEach(function (s) {
    var tr = add(sb, el("tr"));
    txt(tr, "td", "", dash(s[0]));
    txt(tr, "td", "cp-mono-cell", dash(s[1]));
  });

  /* --- provenance footer ----------------------------------------------- */
  var prov = document.getElementById("cp-provenance");
  txt(prov, "div", "",
    data.schema + " built " + dash(data.generated)
    + " over " + dash(snapshot.schema) + " observed " + dash(snapshot.generated)
    + " - local evidence only, no network call, nothing on this page acts.");

  /* --- report drawer ---------------------------------------------------- */
  var drawer = document.getElementById("cp-drawer");
  var drawerTitle = document.getElementById("cp-drawer-title");
  var drawerPath = document.getElementById("cp-drawer-path");
  var drawerBody = document.getElementById("cp-drawer-body");
  document.getElementById("cp-drawer-close").addEventListener("click", closeDrawer);
  drawer.addEventListener("click", function (e) { if (e && e.target === drawer) closeDrawer(); });
  document.addEventListener("keydown", function (e) {
    if (e && (e.key === "Escape" || e.keyCode === 27)) closeDrawer();
  });
  function closeDrawer() { drawer.classList.remove("is-open"); }
  function openReport(r) {
    drawerTitle.textContent = String(r.id);
    drawerPath.textContent = String(r.path || "");
    drawerBody.textContent = "";
    if (!r.readable) {
      txt(drawerBody, "div", "cp-empty", "This report could not be read: " + dash(r.reason));
    } else {
      if (r.truncated) {
        var warn = add(drawerBody, el("div", "cp-notice cp-notice--warn"));
        var wbody = add(warn, el("div", "cp-notice__body"));
        txt(wbody, "div", "cp-notice__title", "Shown truncated");
        txt(wbody, "div", "cp-notice__detail",
          "This report is " + num(r.bytes) + " bytes; only the leading part was read. Open the file for the rest.");
      }
      renderMarkdown(add(drawerBody, el("div", "cp-md")), r.body);
    }
    drawer.classList.add("is-open");
  }
  function addReportOpener(parent, r, label) {
    var b = el("span", "cp-actionlink", label || ("Open " + r.id));
    b.setAttribute("role", "button");
    b.setAttribute("tabindex", "0");
    b.setAttribute("data-open-report", String(r.id));
    b.addEventListener("click", function () { openReport(r); });
    b.addEventListener("keydown", function (e) {
      if (e && (e.key === "Enter" || e.key === " " || e.keyCode === 13 || e.keyCode === 32)) {
        if (e.preventDefault) e.preventDefault();
        openReport(r);
      }
    });
    return add(parent, b);
  }

  if (registered.length) registered[0].classList.add("is-active");
})();
</script>
</body>
</html>
