name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Reduced job set: the hosted full-repository Lint job, the two portable
# parallel behavior shards, and the four-way portable serial behavior matrix
# were retired rather than repaired, because those hosted Linux lanes were
# failing on every push to main. Their owners remain available for deliberate
# local use: bin/fm-lint.sh (also run by the no-mistakes pre-push gate) and
# bin/fm-test-run.sh lanes and --aggregate-json. The test-coverage guard and
# timing aggregate below are retained because they pass on hosted runners
# (the coverage guard is static and does not depend on the excluded hosted
# behavior runner jobs; the timing aggregate only downloads and combines
# whatever per-lane artifacts those excluded jobs would have produced, so it
# has no unmet input to fail on), alongside the inexpensive repository
# invariants.
jobs:
  # Deterministic proof that portable parallel shards + portable serial + the
  # explicit legacy-adapter lane equal the complete tests/*.test.sh inventory
  # with no missing or duplicates, and that the portable serial CI shards
  # partition that serial lane exactly. This guard is static (it inspects
  # bin/fm-test-run.sh's own lane definitions) and does not depend on the
  # excluded hosted runner jobs above.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/fm-test-run.sh --check-coverage

  # Excluded per current captain instruction (recorded in this Firstmate
  # home's private data/captain.md, Firstmate-repository-only): the hosted
  # portable-parallel shards and four-way portable-serial matrix are
  # excluded because the behavior jobs have
  # pre-existing hosted ubuntu-latest runner/Herdr-availability failures.
  # These jobs are not claimed as passing; their owners remain available
  # for deliberate local use:
  # bin/fm-test-run.sh's portable-parallel-1, portable-parallel-2, and
  # portable-serial-<N>of4 lanes, and its --aggregate-json flag
  # (docs/fm-test-portable-shards.md). Test coverage guard, the timing
  # aggregate below, and Repo invariants below are unaffected and remain
  # required.

  # Retain timing aggregation and its existing no-artifacts path while hosted
  # behavior producers are excluded.
  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download lane timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fm-test-timing-*
          path: ${{ runner.temp }}/fm-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/fm-test-aggregate/fm-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-lane timing JSON found to aggregate"
            exit 0
          fi
          bin/fm-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-aggregate
          path: ${{ runner.temp }}/fm-test/fm-test-timing-aggregate.json
          if-no-files-found: warn

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Canonical instruction sources
        run: bin/fm-instruction-sources-check.sh
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet data paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          unexpected_config=$(git ls-files -- config | grep -Ev '^(config/backend|config/crew-dispatch\.json|config/fresh/config\.json|config/herdr-presentation-spaces|config/starship\.toml)$' || true)
          if [ -n "$unexpected_config" ]; then
            echo "::error::Unapproved local config paths are tracked in git:"
            printf '%s\n' "$unexpected_config"
            exit 1
          fi
