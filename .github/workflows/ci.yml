name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Excluded per current captain instruction (recorded in this Firstmate
  # home's private data/captain.md, Firstmate-repository-only): the hosted
  # Lint job's most recent run was cancelled mid-scan by a runner shutdown
  # signal (exit 143) before ShellCheck produced any decisive output, not by
  # a reported lint finding; this is not claimed to be a code-content lint
  # failure, but the job is excluded rather than spending cycles chasing a
  # hosted-runner instability. `bin/fm-lint.sh` (ShellCheck + actionlint) is
  # still the single owner of the lint definition and still runs locally and
  # in the no-mistakes pre-push gate; only its hosted CI invocation here is
  # excluded. Test coverage guard and Repo invariants below are unaffected.

  # Deterministic proof that portable parallel shards + portable serial + the
  # explicit legacy-adapter lane equal the complete tests/*.test.sh inventory
  # with no missing or duplicates,
  # and that the portable serial CI shards partition that serial lane exactly.
  # This guard is static (it inspects bin/fm-test-run.sh's own lane
  # definitions) and does not depend on the excluded hosted runner jobs below.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/fm-test-run.sh --check-coverage

  # Excluded per current captain instruction (recorded in this Firstmate
  # home's private data/captain.md, Firstmate-repository-only): the hosted
  # portable-parallel shards, the four-way portable-serial matrix, and their
  # dependent timing aggregate are excluded because the behavior jobs have
  # pre-existing hosted ubuntu-latest runner/Herdr-availability failures.
  # These jobs are not claimed as passing; their owners remain available
  # for deliberate local use:
  # bin/fm-test-run.sh's portable-parallel-1, portable-parallel-2, and
  # portable-serial-<N>of4 lanes, and its --aggregate-json flag
  # (docs/fm-test-portable-shards.md). Test coverage guard and Repo
  # invariants above/below are unaffected and remain required.

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Canonical instruction sources
        run: bin/fm-instruction-sources-check.sh
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet data paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          unexpected_config=$(git ls-files -- config | grep -Ev '^(config/backend|config/crew-dispatch\.json|config/fresh/config\.json|config/herdr-presentation-spaces|config/starship\.toml)$' || true)
          if [ -n "$unexpected_config" ]; then
            echo "::error::Unapproved local config paths are tracked in git:"
            printf '%s\n' "$unexpected_config"
            exit 1
          fi
