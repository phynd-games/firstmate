name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Reduced job set by explicit captain instruction (2026-09-09): the hosted
# full-repository Lint job, the two portable parallel behavior shards, the
# four-way portable serial behavior matrix, and their dependent coverage guard
# and timing aggregate were retired rather than repaired, because Firstmate
# targets macOS and those Linux lanes had failed on every push to main. Their
# owners remain available for deliberate local use: bin/fm-lint.sh (also run by
# the no-mistakes pre-push gate) and bin/fm-test-run.sh lanes, --check-coverage
# and --aggregate-json. Only the inexpensive repository invariants run here.
jobs:
  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Canonical instruction sources
        run: bin/fm-instruction-sources-check.sh
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet data paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          unexpected_config=$(git ls-files -- config | grep -Ev '^(config/backend|config/crew-dispatch\.json|config/fresh/config\.json|config/herdr-presentation-spaces|config/starship\.toml)$' || true)
          if [ -n "$unexpected_config" ]; then
            echo "::error::Unapproved local config paths are tracked in git:"
            printf '%s\n' "$unexpected_config"
            exit 1
          fi
