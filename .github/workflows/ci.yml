name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Hosted lint and portable behavior jobs are excluded under this task's
  # authorized CI policy; local validation remains required.
  # Deterministic proof that portable parallel shards + portable serial + the
  # explicit legacy-adapter lane equal the complete tests/*.test.sh inventory
  # with no missing or duplicates,
  # and that the portable serial CI shards partition that serial lane exactly.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/fm-test-run.sh --check-coverage

  # Retain timing aggregation and its existing no-artifacts path while hosted
  # behavior producers are excluded.
  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download lane timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fm-test-timing-*
          path: ${{ runner.temp }}/fm-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/fm-test-aggregate/fm-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-lane timing JSON found to aggregate"
            exit 0
          fi
          bin/fm-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-aggregate
          path: ${{ runner.temp }}/fm-test/fm-test-timing-aggregate.json
          if-no-files-found: warn

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Canonical instruction sources
        run: bin/fm-instruction-sources-check.sh
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet data paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          unexpected_config=$(git ls-files -- config | grep -Ev '^(config/backend|config/crew-dispatch\.json|config/fresh/config\.json|config/herdr-presentation-spaces|config/starship\.toml)$' || true)
          if [ -n "$unexpected_config" ]; then
            echo "::error::Unapproved local config paths are tracked in git:"
            printf '%s\n' "$unexpected_config"
            exit 1
          fi
